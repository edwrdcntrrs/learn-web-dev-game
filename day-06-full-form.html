    <h1>Survivor Intake</h1>

    <form>
      <!-- 1. callsign -->
      <label for="callsign">Callsign</label>
      <input type="text" id="callsign" name="callsign" minlength="3" required/>

      <!-- 2. fieldset + legend + three radios sharing name="arrival" -->
      <fieldset>
        <legend>Arrived by:</legend>
        <input type="radio" name="arrival" id="foot" value="foot"/>
        <label for="foot">By foot</label>
        <input type="radio" name="arrival" id="car" value="car"/>
        <label for="car">By car</label>
        <input type="radio" name="arrival" id="bike" value="bike"/>
        <label for="bike">By bike</label>
      </fieldset>

      <!-- 3. labelled select with three options -->
      <label for=sector>Sector Number</label>
      <select id="sector" name="sector">
        <option value="1">Sector 1</option>
        <option value="2">Sector 2</option>
        <option value="3">Sector 3</option>
      </select>

      <!-- 4. labelled textarea -->
      <label for=skills>Any skills?</label>
      <textarea id="skills" name="skills">Describe your skills</textarea>

      <!-- 5. required checkbox -->
      <label for="confirm"></label>
      <input type="checkbox" id="confirm" name="confirm" required <p>do you agree with terms</p>

      <!-- 6. submit button -->
      <button type="submit">Submit</button>
    </form>
  </body>
