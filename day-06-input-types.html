    <h1>Survivor Intake</h1>

    <form>
      <!-- Five labelled fields, then a submit button -->
      <label for="contact">Contact address</label>
      <input type="email" name="contact" id="contact" required/>
      <label for="code">Access code</label>
      <input type="password" id="code" name="code"/>
      <label for="days">Days travelled</label>
      <input type="number" min="0" max="365" id="days" name="days"/>
      <label for="arrival">Date of arrival</label>
      <input type="date" id="arrival" name="arrival" required/>
      <label for="freq">Radio frequency</label>
      <input type="tel" id="freq" name="freq"/>
      <button type="submit">Submit</button>

    </form>
